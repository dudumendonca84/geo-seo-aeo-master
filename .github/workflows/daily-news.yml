name: Daily GEO/SEO/AEO news

"on":
  schedule:
    # 07:00 UTC = 08:00 Lisboa (verão) / 07:00 Lisboa (inverno)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Render daily prompt and load into env
        run: |
          TODAY=$(TZ=Europe/Lisbon date +%Y-%m-%d)
          sed "s/{{TODAY}}/$TODAY/g" daily-agent/daily-prompt.md > /tmp/prompt.md
          {
            echo 'DAILY_PROMPT<<__EOF__'
            cat /tmp/prompt.md
            echo '__EOF__'
          } >> "$GITHUB_ENV"
          echo "Rendered prompt for $TODAY"

      - name: Run daily research agent
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ env.DAILY_PROMPT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            {
              "allowedTools": ["Read", "Write", "Edit", "Bash", "WebFetch", "WebSearch"],
              "max_turns": 30
            }

      - name: Commit and push changes
        run: |
          git config user.name "destaque-ai-bot"
          git config user.email "bot@destaque.ai"
          if [[ -n $(git status --porcelain daily-agent/) ]]; then
            git add daily-agent/
            git commit -m "daily: $(TZ=Europe/Lisbon date +%Y-%m-%d) news update"
            git push
          else
            echo "No changes to commit"
          fi
