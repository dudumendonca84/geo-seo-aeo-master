name: Daily GEO/SEO/AEO news

"on":
  schedule:
    # 07:00 UTC = 08:00 Lisboa (verão) / 07:00 Lisboa (inverno)
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-news.yml'

permissions:
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Render daily prompt (substitui {{TODAY}})
        run: |
          TODAY=$(TZ=Europe/Lisbon date +%Y-%m-%d)
          mkdir -p /tmp/agent
          sed "s/{{TODAY}}/$TODAY/g" daily-agent/daily-prompt.md > /tmp/agent/prompt.md
          echo "Rendered prompt for $TODAY"

      - name: Run daily research agent
        uses: anthropics/claude-code-action@v1
        with:
          prompt_file: /tmp/agent/prompt.md
          claude_args: |
            {
              "allowedTools": ["Read", "Write", "Edit", "Bash", "WebFetch", "WebSearch"],
              "max_turns": 30
            }
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "destaque-ai-bot"
          git config user.email "bot@destaque.ai"
          if [[ -n $(git status --porcelain daily-agent/) ]]; then
            git add daily-agent/
            git commit -m "daily: $(TZ=Europe/Lisbon date +%Y-%m-%d) news update"
            git push
          else
            echo "No changes to commit"
          fi
